<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>专注 · 计时与待办</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* 莫兰迪：暖灰底，低饱和点缀 */
  --bg:#EDEBE7; --card:#FAF9F7; --soft:#F2F0EC;
  --ink:#33302D; --dim:#7C766F; --faint:#A6A099;
  --line:#E1DDD7; --acc:#6E7F77; --acc-s:#6E7F7714;
  --warn:#AD7E72; --ok:#7E9070; --ban-ink:#2F2C2A;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#D2CCC4;border-radius:4px}

.wrap{max-width:880px;margin:0 auto;padding:0 14px 118px}
.wrap.focus-grid{max-width:1510px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;padding-top:14px}
.focus-main{min-width:0}.focus-main .dialcard{margin-top:0}
.focus-side{min-width:0;position:sticky;top:70px;align-self:start;max-height:calc(100vh - 142px);overflow:auto;border-left:1px solid var(--line);padding-left:4px}
.side-title{display:flex;align-items:center;gap:8px;padding:0 4px 9px;color:var(--dim);font-size:12px;font-weight:600}
.side-title .grow{flex:1}
.topbar{position:sticky;top:0;z-index:20;background:#EDEBE7F2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1510px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:16px;font-weight:600;letter-spacing:.01em}
.topbar .sub{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.grow{flex:1}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--dim);border:1px solid var(--line);background:var(--card)}
.ib:hover{color:var(--ink);border-color:#D3CDC5}
.ib.solid{background:var(--acc);color:#fff;border-color:var(--acc)}

/* ---------- 底部标签 ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#FAF9F7F5;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10.5px}
.tab[aria-selected=true]{color:var(--acc)}
.tab svg{opacity:.9}

/* ---------- 计时面板 ---------- */
.dialcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;display:flex;gap:18px;align-items:center}
.dial{position:relative;width:132px;height:132px;flex:none}
.dial svg{transform:rotate(-90deg);width:100%;height:100%}
.dial .rd{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .rd b{font-family:var(--mono);font-weight:300;font-size:27px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dial .rd span{font-size:10px;letter-spacing:.14em;color:var(--faint);margin-top:2px}
.dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.dinfo .p{font-size:11.5px;color:var(--faint)}
.dinfo .n{font-size:19px;font-weight:600}
.dinfo .n.idle{font-size:15px;font-weight:400;color:var(--faint)}
.hook{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--dim);align-self:flex-start;max-width:100%}
.hook.on{border-style:solid;border-color:var(--acc);color:var(--acc);background:var(--acc-s)}
.hook span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 17px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:#D3CDC5}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 11px;font-size:12.5px;font-weight:400;color:var(--dim)}
.mono{font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- 任务横幅 ---------- */
.bans{display:flex;flex-direction:column;gap:9px}
.ban{position:relative;border-radius:13px;overflow:hidden;color:var(--ban-ink);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;min-height:74px;box-shadow:0 1px 2px #0000000D}
.ban::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(120deg,#FFFFFF1F,#00000012);pointer-events:none}
.ban>*{position:relative;z-index:1}
.ban.d1{min-height:60px;margin-left:16px}
.ban.d1::after{background:linear-gradient(120deg,#FBFAF859,#FBFAF83D)}
.ban.d2{min-height:52px;margin-left:32px}
.ban.d2::after{background:linear-gradient(120deg,#FBFAF88C,#FBFAF870)}
.caret{width:22px;height:22px;flex:none;display:grid;place-items:center;color:#2F2C2A99;transition:transform .18s}
.ban.open .caret{transform:rotate(90deg)}
.bt{flex:1;min-width:0}
.bt b{display:block;font-size:17px;font-weight:600;letter-spacing:.01em}
.ban.d1 .bt b{font-size:15px}.ban.d2 .bt b{font-size:14px}
.bt .meta{display:flex;align-items:center;gap:7px;margin-top:2px;font-size:11.5px;color:#2F2C2AB0}
.ringlet{width:17px;height:17px;flex:none}
.ringlet text{font-size:9px;fill:var(--ban-ink);font-family:var(--mono)}
.bgo{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-right:8px}
.bgo button{font-size:15px;font-weight:600;color:var(--ban-ink);padding:6px 8px}
.bgo small{font-size:10.5px;color:#2F2C2A94}
.bmore{width:26px;height:26px;flex:none;display:grid;place-items:center;color:#2F2C2A82;border-radius:7px}
.bmore:hover{background:#FBFAF773;color:var(--ban-ink)}
.ban.live{box-shadow:0 0 0 2px var(--acc),0 2px 10px #6E7F7738}

/* ---------- 待办集 ---------- */
.set{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
.set-h{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
.set-h .cc{color:var(--faint);transition:transform .18s;flex:none}
.set.open .set-h .cc{transform:rotate(90deg)}
.set-t{flex:1;min-width:0}
.set-t b{font-size:14.5px;font-weight:600}
.set-t .s{font-size:11.5px;color:var(--faint);margin-top:2px}
.set-t .rng{font-family:var(--mono);color:var(--dim);font-size:11px}
.set-pct{font-family:var(--mono);font-size:15px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.pbar{height:8px;background:#E4E0DA;border-radius:5px;overflow:hidden;margin:0 14px 12px}
.pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#93A29B,var(--acc));transition:width .4s cubic-bezier(.4,0,.2,1)}
.pbar i.full{background:linear-gradient(90deg,#9AAB8C,var(--ok))}
.pbar.slim{height:6px;margin:0 14px 10px}
.set-b{border-top:1px solid var(--line);background:var(--soft)}
.todo{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:none}
.ck{width:20px;height:20px;flex:none;border:1.6px solid #CFC9C1;border-radius:6px;display:grid;place-items:center;margin-top:1px;background:var(--card)}
.ck.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tdt{flex:1;min-width:0}
.tdt .ti{font-size:13.5px}
.tdt .ti.done{color:var(--faint);text-decoration:line-through}
.tdt .tm{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.pill{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--card);border:1px solid var(--line);color:var(--dim);display:inline-flex;align-items:center;gap:4px}
.pill .sw{width:7px;height:7px;border-radius:2px}
.pill.od{color:var(--warn);border-color:#C15A3E4D;background:#C15A3E0F}
.pill.ok{color:var(--ok);border-color:#3E8E5A4D;background:#3E8E5A0F}
.pill.tm2{font-family:var(--mono)}
.tdact{display:flex;gap:4px;flex:none}
.tdact button{color:var(--faint);padding:3px 5px;font-size:12px;border-radius:6px}
.tdact button:hover{background:var(--card);color:var(--ink)}

/* ---------- 统计 ---------- */
.nav{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:11px}
.nav b{font-family:var(--mono);font-size:14px;font-weight:500}
.nav .d{font-size:11.5px;color:var(--faint)}
.nav button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.nav button:hover{background:var(--soft)}
.nav button:disabled{opacity:.3}
.seg-tabs{display:flex;background:var(--soft);border-radius:9px;padding:2px;gap:2px}
.seg-tabs button{padding:5px 13px;font-size:12.5px;border-radius:7px;color:var(--dim)}
.seg-tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px #0000000F}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:11px}
.stat3 div{background:var(--card);padding:13px 10px;text-align:center}
.stat3 .k{font-size:11px;color:var(--faint);margin-bottom:4px}
.stat3 .v{font-family:var(--mono);font-size:21px;font-weight:400}
.stat3 .v i{font-style:normal;font-size:11px;color:var(--faint);margin:0 1px 0 2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px}
.panel>h3{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:12px;letter-spacing:.03em}
.piewrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.legend{flex:1;min-width:190px;display:flex;flex-direction:column;gap:7px}
.lg{display:flex;align-items:center;gap:8px;font-size:12.5px}
.lg .sw{width:9px;height:9px;border-radius:3px;flex:none}
.lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .vv{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.track{position:relative;height:26px;background:#E9E5DF;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.track .tk{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.track .blk{position:absolute;top:3px;bottom:3px;border-radius:2px;min-width:2px}
.axis{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.slot{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.slot:last-child{border-bottom:none}
.slot .tm{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:none}
.slot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .du{font-family:var(--mono);font-size:11.5px;color:var(--faint);flex:none}
.slot .x{opacity:0;color:var(--faint);flex:none}
.slot:hover .x{opacity:1}
.done-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.done-row:last-child{border-bottom:none}
.done-row .ico{width:18px;height:18px;border-radius:5px;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.empty{text-align:center;color:var(--faint);font-size:12.5px;padding:18px 0}

/* ---------- 正在专注 悬浮条 ---------- */
.mini{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:29;display:flex;justify-content:center;padding:0 14px 8px;pointer-events:none}
.mini-in{pointer-events:auto;max-width:852px;width:100%;background:var(--acc);color:#FBFAF8;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:11px;box-shadow:0 4px 16px #6E7F7747}
.mini-in b{font-family:var(--mono);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
.mini-in .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-in button{color:#fff;font-size:12.5px;border:1px solid #FFFFFF55;border-radius:7px;padding:4px 10px}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;top:0;right:0;bottom:0;left:0;background:#33302DA8;backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(28px);opacity:.6}}
.sheet h3{padding:16px 18px 12px;font-size:15px;font-weight:600;position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line)}
.sb{padding:16px 18px;display:flex;flex-direction:column;gap:15px}
.sf{padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:9px}
.sf .btn{flex:1;text-align:center}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:11.5px;color:var(--faint);font-weight:500}
.field input,.field select,.field textarea{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--acc);background:var(--card)}
.hint{font-size:11.5px;color:var(--faint);line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;font-size:12.5px;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.switch{width:48px;height:26px;border-radius:999px;background:#D8D3CC;border:1px solid var(--line);padding:2px;display:inline-flex;align-items:center;transition:.18s}
.switch i{width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px #00000024;transition:.18s}
.switch[aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
.switch[aria-pressed=true] i{transform:translateX(22px)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw-o{height:38px;border-radius:9px;border:2px solid transparent;position:relative}
.sw-o[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.picklist{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:9px}
.pick{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:none}
.pick:hover{background:var(--soft)}
.pick .sw{width:9px;height:9px;border-radius:3px;flex:none}
.pick .p{font-size:11px;color:var(--faint)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#3B3733;color:#FAF9F7;border-radius:9px;padding:9px 16px;font-size:13px;z-index:90;box-shadow:0 4px 14px #00000030}
@media (max-width:560px){
  .dialcard{flex-direction:column;text-align:center}
  .dinfo{align-items:center}
  .hook{align-self:center}
  .stat3 .v{font-size:18px}
}
@media (max-width:980px){
  .wrap.focus-grid{display:block;max-width:880px;padding-top:0}
  .focus-main .dialcard{margin-top:14px}
  .focus-side{position:static;max-height:none;border-left:none;padding-left:0;margin-top:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in" id="topbar"></div></div>
<div class="wrap" id="view"></div>
<div id="mini"></div>
<nav class="tabs"><div class="tabs-in" id="tabs">
  <button class="tab" data-tab="focus"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>计时</button>
  <button class="tab" data-tab="todo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/><path d="M18 17l1.6 1.6L23 15"/></svg>待办集</button>
  <button class="tab" data-tab="stat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 109 9h-9z"/><path d="M14 2.2A9 9 0 0121.8 10H14z"/></svg>统计</button>
  <button class="tab" data-tab="me"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>我的</button>
</div></nav>
<div id="modals"></div>
<script>
/* ================= 存储 =================
   数据和计时都在本机后台服务里（server/app.py）。
   页面只负责显示和点击，关掉页面计时照样走。
   没有本地兜底：连不上后端就是连不上，页面会直说，不会假装还能用。 */
const API = '';                 // 同源
let REV = -1, SREV = -1;        // 服务端版本号：state / sessions
let pendingSave = false;

async function api(path, opts){
  let r;
  try {
    r = await fetch(API + path, Object.assign({
      headers: { 'Content-Type': 'application/json' }
    }, opts || {}));
  } catch(e){
    const err = new Error('连不上后台'); err.network = true; throw err;   // 只有这种才算掉线
  }
  if (r.status === 401){ location.href = '/'; const e = new Error('要重新输口令'); e.auth = true; throw e; }
  let data = null;
  try { data = await r.json(); } catch(e){}
  if (!r.ok && r.status !== 409) throw new Error((data && data.error) || ('HTTP ' + r.status));
  return { status: r.status, data };
}

/* ================= 工具 ================= */
const DAY = 86400000;
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

function dk(ts){ const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fromDk(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d).getTime(); }
function addDays(s, n){ return dk(fromDk(s) + n*DAY + 3*3600000); }
function today(){ return dk(Date.now()); }
function diffDays(a, b){ return Math.round((fromDk(b) - fromDk(a)) / DAY); }
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
function weekday(s){ return WD[new Date(fromDk(s)).getDay()]; }
function fmtMin(m){
  m = Math.round(m);
  if (m <= 0) return '0分钟';
  if (m < 60) return m + '分钟';
  const h = Math.floor(m/60), r = m%60;
  return r ? `${h}小时${r}分钟` : `${h}小时`;
}
function fmtClock(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function hhmm(ts){ const d = new Date(ts); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function splitVal(m){
  m = Math.round(m);
  const h = Math.floor(m/60), r = m%60;

}

/* 莫兰迪：低饱和、高灰度，同色相内做明度位移 */
const GRAD = [
  ['#A3B4C2','#8B9DAD'], ['#7E8D9C','#697A8B'], ['#9DB3B0','#849B98'],
  ['#A9B7A4','#90A08B'], ['#7E8F84','#68796F'], ['#CDB894','#B8A178'],
  ['#C9AEAA','#B39591'], ['#C4A08F','#AD8777'], ['#AEA3B4','#958A9D'],
  ['#BFA0A8','#A78791'], ['#C3BBB1','#ABA297'], ['#8A8783','#6E6B68']
];
function gradPair(t){
  let c = t, guard = 0;
  while (c && !c.g && guard++ < 8) c = c.parentId ? byId(c.parentId) : null;
  return (c && c.g) || GRAD[0];
}
const grad = t => { const g = gradPair(t); return `linear-gradient(102deg,${g[0]},${g[1]})`; };
const solid = t => gradPair(t)[0];

function applySnapshot(snap){
  if (!snap) return;
  ['tasks','todos','completions','plans','sessions'].forEach(k => { if (snap[k]) S[k] = snap[k]; });
  if (snap.settings) S.settings = Object.assign(seed().settings, snap.settings);
  if ('running' in snap) S.running = snap.running;
  if (snap.rev !== undefined) REV = snap.rev;
  if (snap.srev !== undefined) SREV = snap.srev;
}

async function load(){
  S = { tasks: [], todos: [], sessions: [], completions: [], plans: [], settings: {}, running: null };
  try {
    const { data } = await api('/api/state');
    applySnapshot(data);
    if (!S.tasks.length){          // 空库：种一份初始数据再写回
      const s = seed();
      S.tasks = s.tasks; S.todos = s.todos; S.settings = s.settings;
      await pushState();
    }
  } catch(e){
    return false;
  }
  S.settings = Object.assign(seed().settings, S.settings || {});
  ['tasks','todos','sessions','completions','plans'].forEach(k => S[k] = S[k] || []);
  S.running = S.running || null;
  return true;
}

/* state（任务/待办/结算/计划/设置）由页面整体写回，带 rev 乐观锁。
   sessions 和 running 归后端管，页面不直接写。 */
let saveT = null, saving = false;
function save(){ clearTimeout(saveT); saveT = setTimeout(pushState, 200); }
function flushSave(keepalive){ clearTimeout(saveT); return pushState(keepalive); }

async function pushState(keepalive){
  if (saving){ pendingSave = true; return; }
  saving = true;
  try {
    const body = JSON.stringify({ rev: REV, state: {
      tasks: S.tasks, todos: S.todos, completions: S.completions,
      plans: S.plans, settings: S.settings } });
    const opts = { method: 'PUT', body };
    if (keepalive) opts.keepalive = true;
    const { status, data } = await api('/api/state', opts);
    if (status === 409){ applySnapshot(data); REV = data.rev; toast('数据在别处改过，已刷新'); render(); }
    else REV = data.rev;
  } catch(e){
    if (e.auth) return;
    toast(e.network ? '后台连不上，改动没保存上' : ('保存失败：' + e.message));
    saveT = setTimeout(pushState, 5000);            // 等会儿自己再试一次
  } finally {
    saving = false;
    if (pendingSave){ pendingSave = false; pushState(); }
  }
}

}

/* 后端有变化就拉回来：自动结束的计时、别的页面的改动 */
async function syncPoll(){
  if (!S) return;
  try {
    const { data } = await api(`/api/sync?rev=${REV}&srev=${SREV}`);
    let dirty = false;
    if (data.state){ applySnapshot(data.state); dirty = true; }
    if (data.sessions){ S.sessions = data.sessions; dirty = true; }
    REV = data.rev; SREV = data.srev;
    const now = JSON.stringify(data.running || null);
    if (now !== JSON.stringify(S.running || null)){
      S.running = data.running; pomoAlerted = false; dirty = true;
    }
    if (dirty) render();
    checkAutoStopped();
  } catch(e){}
}

/* 接口回包里带了 running / sessions 就直接用 */
async function applyTimerRes(data){
  if (!data) return;
  if ('running' in data) S.running = data.running;
  if (data.sessions){ S.sessions = data.sessions; }
  if (data.srev !== undefined){
    if (data.sessions) SREV = data.srev;
    else if (data.srev !== SREV){ try { await refetchSessions(); } catch(e){} }
  }

/* ================= 任务树 ================= */
const byId = id => S.tasks.find(x => x.id === id);
const kids = id => S.tasks.filter(x => x.parentId === id).sort((a,b) => a.order - b.order);
const isLeaf = t => !S.tasks.some(x => x.parentId === t.id);
function depthOf(t){ let d = 0, c = t; while (c && c.parentId){ c = byId(c.parentId); d++; } return d; }
function ancestors(t){ const o = []; let c = t; while (c && c.parentId){ c = byId(c.parentId); if (c) o.unshift(c); } return o; }
function pathOf(t){ return ancestors(t).map(x => x.name).join(' / '); }
function subtree(id){ const o = [id]; for (const k of kids(id)) o.push(...subtree(k.id)); return o; }

/* 任务时长：只算直接记在该任务上的（子任务单独统计），聚合时用 subtree */
function taskMin(taskId, from, to, deep){
  const ids = deep ? subtree(taskId) : [taskId];
  let ms = 0;
  for (const s of S.sessions){
    if (!ids.includes(s.taskId)) continue;
    if (from != null && s.end <= from) continue;
    if (to != null && s.start >= to) continue;
    ms += Math.min(s.end, to ?? s.end) - Math.max(s.start, from ?? s.start);
  }
  return ms / 60000;
}
function taskCount(taskId, from, to, deep){
  const ids = deep ? subtree(taskId) : [taskId];
  return S.sessions.filter(s => ids.includes(s.taskId) && s.start >= from && s.start < to).length;
}

/* ================= 待办 ================= */
const todoById = id => S.todos.find(x => x.id === id);
const planById = id => S.plans.find(x => x.id === id);
function todoKind(td){
  if (td.kind) return td.kind;
  return td.cycleDays > 0 ? 'loop' : 'open';
}
function normalizeTodo(td){
  td.kind = todoKind(td);
  if (td.kind === 'loop'){
    td.cycleDays = Math.max(1, +td.cycleDays || 1);
    td.cycleStart = td.cycleStart || today();
    td.timeBase = td.timeBase || fromDk(td.cycleStart);
    td.onExpire = td.onExpire || 'reset';
  } else if (td.kind === 'dated'){
    td.startDate = td.startDate || today();
    td.startTime = td.startTime || '00:00';
    td.dueDate = td.dueDate || today();
    td.dueTime = td.dueTime || '23:59';
    td.timeBase = td.timeBase || new Date(`${td.startDate}T${td.startTime}`).getTime();
  } else {
    td.kind = 'open';
    td.cycleDays = 0;
  }
  return td;
}
function todoStartTs(td){
  normalizeTodo(td);
  if (td.kind === 'loop') return fromDk(td.cycleStart);
  if (td.kind === 'dated') return new Date(`${td.startDate}T${td.startTime || '00:00'}`).getTime();
  return td.timeBase || 0;
}
function todoDueTs(td){
  normalizeTodo(td);
  if (td.kind === 'loop') return fromDk(addDays(td.cycleStart, td.cycleDays));
  if (td.kind === 'dated') return new Date(`${td.dueDate}T${td.dueTime || '23:59'}`).getTime();
  return null;
}
function todoDueDay(td){
  normalizeTodo(td);
  if (td.kind === 'loop') return addDays(td.cycleStart, td.cycleDays - 1);
  if (td.kind === 'dated') return td.dueDate;
  return null;
}
const cycleEndOf = td => todoKind(td) === 'loop' ? addDays(normalizeTodo(td).cycleStart, normalizeTodo(td).cycleDays) : null;
function cycleSpan(td){
  normalizeTodo(td);
  if (td.kind === 'loop') return { s: td.cycleStart, e: addDays(td.cycleStart, td.cycleDays - 1) };
  if (td.kind === 'dated') return { s: td.startDate, e: td.dueDate };
  return null;
}
const shortD = d => d.slice(5);
function spanText(sp, short){
  if (!sp) return '不限期';
  const f = short ? shortD : (x => x);
  return sp.s === sp.e ? f(sp.s) : `${f(sp.s)} → ${f(sp.e)}`;
}
function cycleName(n){
  if (!n) return '不限期';
  if (n === 1) return '每天';
  if (n === 7) return '每周';
  return `每 ${n} 天`;
}
function todoModeName(td){
  normalizeTodo(td);
  if (td.kind === 'loop') return `循环 · ${cycleName(td.cycleDays)}`;
  if (td.kind === 'dated') return '有期限';
  return '不限期';
}
function rangeText(td, short){
  normalizeTodo(td);
  if (td.kind === 'open') return '不限期';
  const sp = cycleSpan(td);
  const f = short ? shortD : (x => x);
  if (td.kind === 'loop') return sp.s === sp.e ? `${f(sp.s)} 00:00-23:59` : `${f(sp.s)} 00:00 → ${f(sp.e)} 23:59`;
  const base = spanText(sp, short);
  if (td.kind === 'dated') return `${base} ${td.startTime || '00:00'}-${td.dueTime || '23:59'}`;
  return base;
}
function todoMin(td){
  let ms = 0;
  const base = td.timeBase || todoStartTs(td) || 0;
  for (const s of S.sessions) if (s.todoId === td.id && s.start >= base) ms += s.end - s.start;
  return ms / 60000;
}
function todoMinRange(td, from, to){
  let ms = 0;
  for (const s of S.sessions){
    if (s.todoId !== td.id) continue;
    if (from != null && s.end <= from) continue;
    if (to != null && s.start >= to) continue;
    ms += Math.min(s.end, to ?? s.end) - Math.max(s.start, from ?? s.start);
  }
  return ms / 60000;
}
function isOverdue(td){
  if (td.done) return false;
  const due = todoDueTs(td);
  if (!due) return false;
  return todoKind(td) === 'loop' ? today() >= cycleEndOf(td) : Date.now() > due;
}
function settleTodo(td, status, day, minutes, extra){
  const id = uid();
  S.completions.push(Object.assign({
    id, todoId: td.id, title: td.title, taskId: td.taskId,
    day: day || today(), at: Date.now(), minutes: Math.max(0, minutes ?? todoMin(td)),
    from: dk(todoStartTs(td) || Date.now()), cycleDays: td.cycleDays || 0,
    kind: status, mode: todoKind(td), range: rangeText(td, true)
  }, extra || {}));
  return id;
}

function rollTodos(){
  const tdy = today();
  let ch = false;
  for (const td of S.todos){
    normalizeTodo(td);
    if (td.kind !== 'loop') continue;
    let guard = 0;
    while (tdy >= cycleEndOf(td) && guard++ < 400){
      if (td.done){
        // 完成过的：进入下一周期，重新开始
        td.cycleStart = cycleEndOf(td);
        td.done = false; td.doneAt = null;
        td.timeBase = fromDk(td.cycleStart);
      } else if (td.onExpire === 'reset'){
        const from = fromDk(td.cycleStart), to = fromDk(cycleEndOf(td));
        settleTodo(td, 'expired', todoDueDay(td), todoMinRange(td, from, to), {
          from: td.cycleStart, range: rangeText(td, true)
        });
        td.cycleStart = cycleEndOf(td);
        td.timeBase = fromDk(td.cycleStart);   // 消耗时间清零
        td.missed = (td.missed || 0) + 1;
      } else {
        break;  // 保留逾期状态：周期不推进，耗时继续累计
      }
      ch = true;
    }
  }
  if (ch) save();
}

function toggleTodo(id){
  const td = todoById(id); if (!td) return;
  normalizeTodo(td);
  if (td.done){
    td.done = false; td.doneAt = null;
    const i = S.completions.findIndex(c => c.todoId === id && c.day === dk(td.doneAtWas || Date.now()));
    if (i >= 0) S.completions.splice(i, 1);
    else { const j = S.completions.map(c => c.todoId).lastIndexOf(id); if (j >= 0) S.completions.splice(j, 1); }
  } else {
    const od = isOverdue(td);
    td.done = true; td.doneAt = Date.now(); td.doneAtWas = td.doneAt;
    settleTodo(td, od ? 'late_done' : 'done', today(), todoMin(td), { at: td.doneAt, overdue: od });
  }
  save(); render();
}

/* 待办集：循环按天数分组；一次性逾期单独进入逾期栏 */
function todoSets(){
  const g = {};
  for (const td of S.todos){
    normalizeTodo(td);
    let key;
    if (td.kind === 'loop') key = `loop:${td.cycleDays}`;
    else if (td.kind === 'dated' && isOverdue(td)) key = 'overdue';
    else if (td.kind === 'dated') key = 'dated';
    else key = 'open';
    (g[key] = g[key] || []).push(td);
  }
  const order = key => key === 'overdue' ? -1 : key.startsWith('loop:') ? +key.split(':')[1] : key === 'dated' ? 9000 : 9999;
  return Object.keys(g).sort((a,b) => order(a) - order(b)).map(key => {
    const list = g[key].sort((a,b) => (a.done - b.done) || (a.order - b.order));
    return { key, days: key.startsWith('loop:') ? +key.split(':')[1] : null, list };
  });
}

/* 周期自定待办：到周期起点提醒创建一次性待办 */
function normalizePlan(p){
  p.startDate = p.startDate || today();
  p.cycleDays = Math.max(1, +p.cycleDays || 7);
  p.dueDays = Math.max(1, +p.dueDays || p.cycleDays);
  p.active = p.active !== false;
  return p;
}
function planCycleStart(p){
  normalizePlan(p);
  const passed = Math.max(0, Math.floor((fromDk(today()) - fromDk(p.startDate)) / DAY));
  return addDays(p.startDate, Math.floor(passed / p.cycleDays) * p.cycleDays);
}
function planDueDate(p, start){
  return addDays(start, Math.max(1, +p.dueDays || +p.cycleDays || 1) - 1);
}
function pendingPlan(){
  for (const p of S.plans){
    normalizePlan(p);
    if (!p.active) continue;
    const start = planCycleStart(p);
    if (fromDk(today()) < fromDk(start)) continue;
    const key = `${p.id}:${start}`;
    if (p.lastCreated === start || DISMISSED_PLANS.has(key)) continue;
    const exists = S.todos.some(td => td.planId === p.id && td.planStart === start);
    if (!exists) return { p, start, key };
  }
  return null;
}
function remindPlan(){
  if ($('#modals').children.length) return;
  const hit = pendingPlan();
  if (!hit) return;
  const { p, start, key } = hit;
  sheet('周期自定待办', `
    <div class="hint">新的周期已经开始，还没有创建这条待办。</div>
    <div class="field"><label>内容</label><input id="p-make-title" value="${esc(p.title)}"></div>
    <div class="field"><label>期限</label><input type="date" id="p-make-due" value="${planDueDate(p, start)}"></div>
  `, `<button class="btn" data-act="dismiss-plan" data-id="${key}">稍后</button>
      <button class="btn pri" data-act="make-plan-todo" data-id="${p.id}" data-start="${start}">创建待办</button>`);
}

/* ================= 计时 =================
   计时归后端管：start_ts 存在库里，页面关掉、刷新、换浏览器都不影响。
   离线时退回原来的本地实现。 */
let pomoAlerted = false;
function elapsed(){
  if (!S.running) return 0;
  return S.running.accum + (S.running.startTs ? Date.now() - S.running.startTs : 0);
}
async function startTimer(taskId, todoId){
  const explicit = todoId !== undefined;
  const sameTask = S.running && S.running.taskId === taskId;
  const body = { taskId };
  if (explicit) body.todoId = todoId ?? null;
  else if (!sameTask) body.todoId = S.pending ?? null;   // 新开的计时才继承预选的待办
  S.pending = null;
  pomoAlerted = false;
  try {
    const { data } = await api('/api/timer/start', { method: 'POST', body: JSON.stringify(body) });
    await applyTimerRes(data);
  } catch(e){ toast('后台没响应，计时没开起来'); }
}
async function pauseTimer(){
  if (!S.running || !S.running.startTs) return;
  try {
    const { data } = await api('/api/timer/pause', { method: 'POST', body: '{}' });
    await applyTimerRes(data);
  } catch(e){ toast('后台没响应，暂停失败'); }
}
async function stopTimer(){
  if (!S.running) return;
  try {
    const { data } = await api('/api/timer/stop', { method: 'POST', body: '{}' });
    await applyTimerRes(data);
    toast(data.recorded ? `已记录 ${fmtMin(data.total/60000)}` : '不足 15 秒，未记录');
  } catch(e){ toast('后台没响应，结束失败'); }
}
async function hookTimer(todoId){
  if (!S.running){ S.pending = todoId; render(); return; }
  try {
    const { data } = await api('/api/timer/hook', { method: 'POST', body: JSON.stringify({ todoId }) });
    await applyTimerRes(data);
  } catch(e){ toast('挂钩没保存上'); }
}
function beep(){
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 680;
    g.gain.value = .0001; g.gain.exponentialRampToValueAtTime(.13, c.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .9);
    o.start(); o.stop(c.currentTime + .95);
  } catch(e){}
}

      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 8.5 8.5)"/></svg>`;
}
function banner(t, depth){
  const tdy = today(), a = fromDk(tdy), b = a + DAY;
  const has = kids(t.id).length;
  const own = taskMin(t.id, a, b, false);
  const deep = taskMin(t.id, a, b, true);
  const n = taskCount(t.id, a, b, true);

    ? `${ringlet(pct)}<span>今日 ${Math.round(deep)}/${t.target} 分钟</span>`

/* ================= 统计页 ================= */
function settlementLabel(c){
  const kind = c.kind || (c.overdue ? 'late_done' : 'done');
  return {
    done: ['已完成', 'ok'],
    ended: ['手动结束', ''],
    expired: ['逾期未完成', 'od'],
    late_done: ['逾期已完成', 'od']
  }[kind] || ['已结算', ''];
}
function renderStat(){
  const day = statDay || today();
  const a = fromDk(day), b = a + DAY;
  const allMs = S.sessions.reduce((x,s) => x + (s.end - s.start), 0);
  const allN = S.sessions.length;
  const daysSpan = (() => {
    if (!S.sessions.length) return 1;
    const first = dk(Math.min(...S.sessions.map(s => s.start)));
    return Math.max(1, diffDays(first, today()) + 1);
  })();
  const dayS = S.sessions.filter(s => s.end > a && s.start < b);
  const dayMs = dayS.reduce((x,s) => x + (Math.min(s.end,b)-Math.max(s.start,a)), 0);

  // 饼图：按任务名聚合（不显示待办名）
  const g = {};
  dayS.forEach(s => { const t = byId(s.taskId); if (!t) return;
    g[t.id] = (g[t.id]||0) + (Math.min(s.end,b)-Math.max(s.start,a))/60000; });
  const pie = Object.entries(g).map(([id,m]) => ({ t: byId(id), m })).filter(x => x.t).sort((x,y) => y.m - x.m);
  const sum = pie.reduce((x,y) => x + y.m, 0) || 1;
  let ang = -Math.PI/2;
  const R = 62, cx = 74, cy = 74;
  const slices = pie.map(({t,m}) => {
    const a1 = ang, a2 = ang + m/sum*2*Math.PI; ang = a2;
    if (m/sum > .999) return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${solid(t)}"/>`;
    const x1 = cx+R*Math.cos(a1), y1 = cy+R*Math.sin(a1), x2 = cx+R*Math.cos(a2), y2 = cy+R*Math.sin(a2);
    return `<path d="M${cx} ${cy}L${x1} ${y1}A${R} ${R} 0 ${a2-a1>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${solid(t)}" stroke="#fff" stroke-width="1.5"/>`;
  }).join('');

  const comps = S.completions.filter(c => c.day === day).sort((x,y) => y.at - x.at);
  const ticks = [3,6,9,12,15,18,21].map(h => `<div class="tk" style="left:${h/24*100}%"></div>`).join('');
  const blocks = dayS.sort((x,y) => x.start-y.start).map(s => {
    const t = byId(s.taskId); if (!t) return '';
    const l = (Math.max(s.start,a)-a)/DAY*100, w = (Math.min(s.end,b)-Math.max(s.start,a))/DAY*100;
    return `<div class="blk" style="left:${l}%;width:${Math.max(w,.3)}%;background:${solid(t)}" title="${esc(t.name)} ${hhmm(s.start)}–${hhmm(s.end)}"></div>`;
  }).join('');

  $('#view').innerHTML = `<div style="height:14px"></div>
  <div class="nav">
    <button data-act="day" data-v="-1" aria-label="前一天"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div><b>${day}</b> <span class="d">${weekday(day)}${day===today()?' · 今天':''}</span></div>
    <div class="grow"></div>
    <button data-act="day" data-v="1" ${day>=today()?'disabled':''} aria-label="后一天"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg></button>
    ${day!==today()?`<button data-act="day" data-v="0" aria-label="回到今天" title="回到今天"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>`:''}
  </div>

  <div class="stat3">
    <div><div class="k">累计次数</div><div class="v">${allN}</div></div>
    <div><div class="k">累计时长</div><div class="v">${splitVal(allMs/60000)}</div></div>
    <div><div class="k">日均时长</div><div class="v">${splitVal(allMs/60000/daysSpan)}</div></div>
  </div>
  <div class="stat3">
    <div><div class="k">当日次数</div><div class="v">${dayS.length}</div></div>
    <div><div class="k">当日时长</div><div class="v">${splitVal(dayMs/60000)}</div></div>
    <div><div class="k">当日结算待办</div><div class="v">${comps.length}</div></div>
  </div>

  <div class="panel"><h3>专注时长分布 · ${day}</h3>
    ${pie.length ? `<div class="piewrap">
      <svg width="148" height="148" viewBox="0 0 148 148">${slices}</svg>
      <div class="legend">${pie.map(({t,m}) => `<div class="lg"><span class="sw" style="background:${solid(t)}"></span>
        <span class="nm">${esc(t.name)}</span><span class="vv">${fmtMin(m)} · ${Math.round(m/sum*100)}%</span></div>`).join('')}</div>
    </div>` : `<div class="empty">这天还没有专注记录</div>`}
  </div>

  <div class="panel"><h3>时间段分布</h3>
    <div class="track">${ticks}${blocks}</div>
    <div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    <div style="margin-top:10px">${dayS.map(s => {
      const t = byId(s.taskId); const td = s.todoId ? todoById(s.todoId) : null;
      return `<div class="slot"><span class="sw" style="width:8px;height:8px;border-radius:3px;background:${t?solid(t):'#ccc'};flex:none"></span>
        <span class="tm">${hhmm(s.start)}–${hhmm(s.end)}</span>
        <span class="nm">${t?esc(t.name):'（已删除）'}${td?` <span style="color:var(--faint)">· ${esc(td.title)}</span>`:''}</span>
        <span class="du">${fmtMin((s.end-s.start)/60000)}</span>
        ${s.manual?'<span class="pill">补记</span>':''}${s.auto?'<span class="pill od">自动结束</span>':''}
        <button class="x" data-act="del-sess" data-id="${s.id}">✕</button></div>`;
    }).join('') || '<div class="empty">无</div>'}</div>
  </div>

  <div class="panel"><h3>已结算 · ${day}</h3>
    ${comps.map(c => {
      const t = c.taskId ? byId(c.taskId) : null;
      const span = c.from && c.from !== c.day ? `${diffDays(c.from, c.day)+1} 天` : '当天';
      const lab = settlementLabel(c);
      return `<div class="done-row">
        <span class="ico"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M4 12.5l5.5 5.5L20 7"/></svg></span>
        <div style="flex:1;min-width:0"><div style="font-size:13.5px">${esc(c.title)}</div>
          <div style="font-size:11px;color:var(--faint);margin-top:2px">${t?esc(t.name)+' · ':''}${c.range || cycleName(c.cycleDays)} · 历时 ${span}</div></div>
        <span class="pill ${lab[1]}">${lab[0]}</span>
        <span class="du" style="font-family:var(--mono);font-size:12px;color:var(--dim)">${fmtMin(c.minutes)}</span>
      </div>`;
    }).join('') || '<div class="empty">这天还没有结算的待办</div>'}
  </div>`;
}

function taskPickList(sel, allowNone){
  const rows = [];
  const walk = (id, d) => kids(id).forEach(t => {
    rows.push(`<div class="pick" data-pick-task="${t.id}" style="padding-left:${12+d*16}px">
      <span class="sw" style="background:${solid(t)}"></span>
      <div style="flex:1"><div>${esc(t.name)}</div>${d?`<div class="p">${esc(pathOf(t))}</div>`:''}</div>
      ${sel===t.id?'<span style="color:var(--acc)">✓</span>':''}</div>`);
    walk(t.id, d+1);
  });
  walk(null, 0);
  return `<div class="picklist">${allowNone?`<div class="pick" data-pick-task=""><span class="sw" style="background:#CBD2DA"></span><div style="flex:1">不挂钩任务</div>${!sel?'<span style="color:var(--acc)">✓</span>':''}</div>`:''}${rows.join('')}</div>`;
}

function openTodo(id, presetDays, presetKind){

  const startTime = x ? (x.startTime || '00:00') : '00:00';
  const dueDate = x ? (x.kind === 'dated' ? x.dueDate : addDays(startDate, Math.max(1, days) - 1)) : today();

  const repeatOn = kind !== 'dated';

        <button data-v="keep" aria-pressed="${x&&x.onExpire==='keep'}">保留逾期状态</button>
      </div>
      <div class="hint">重置：新周期从零开始，之前投入的时间不再算在这条待办头上（专注记录本身不会删）。<br>
      保留：周期不往前推，它会一直挂着并标红，投入时间继续累加，直到你勾掉。</div></div>
    <div class="field"><label>挂钩任务（计时归到哪个任务名下）</label>
      <div id="d-task">${taskPickList(x?x.taskId:null, true)}</div></div>
  `, `${x?`<button class="btn" data-act="del-todo" data-id="${x.id}">删除</button>`:''}

      <button class="btn pri" data-act="save-todo" data-id="${x?x.id:''}">${x?'保存':'创建'}</button>`);

  let pickTask = x ? x.taskId : null;
  $('#d-task').addEventListener('click', e => {
    const p = e.target.closest('[data-pick-task]'); if (!p) return;
    pickTask = p.dataset.pickTask || null;
    $('#d-task').innerHTML = taskPickList(pickTask, true);
  });
  const refreshTodoForm = () => {
    const k = $('#d-kind').querySelector('[aria-pressed=true]').dataset.v;
    const cv = $('#d-cyc').querySelector('[aria-pressed=true]').dataset.v;
    const isCustom = cv === 'c';

    $('#d-dated-dates').style.display = (k === 'dated' || (k === 'loop' && isCustom && !repeat)) ? '' : 'none';
    $('#d-exp-wrap').style.display = asLoop ? '' : 'none';
  };

    const sd = $('#d-start-date').value || today();

    if (b.dataset.v !== 'c') $('#d-repeat').setAttribute('aria-pressed', 'true');
    refreshTodoForm(); syncLoopEnd();
  });
  $('#d-repeat').addEventListener('click', e => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', on);
    refreshTodoForm();
  });
  $('#d-days').addEventListener('input', syncLoopEnd);
  $('#d-start-date').addEventListener('change', syncLoopEnd);
  $('#d-loop-end').addEventListener('change', syncDaysFromEnd);
  $('#d-exp').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $('#d-exp').querySelectorAll('button').forEach(z => z.setAttribute('aria-pressed', z === b));
  });
  refreshTodoForm();
  window.__pickTask = () => pickTask;
}

function render(){
  rollTodos();
  renderTop();
  $('#view').className = `wrap${tab === 'focus' ? ' focus-grid' : ''}`;
  if (tab === 'focus') renderFocus();
  else if (tab === 'todo') renderTodo();
  else if (tab === 'stat') renderStat();
  else renderMe();
  renderMini();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  setTimeout(remindPlan, 0);
}
function tick(){
  if (!S || !S.running || !S.running.startTs) return;
  if (tab === 'focus') renderFocus(); else renderMini();
}

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const tb = e.target.closest('.tab');
  if (tb){ tab = tb.dataset.tab; render(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  switch(act){
    case 'fold': e.stopPropagation(); OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id); renderFocus(); break;
    case 'fold-set': OPENSET.has(id) ? OPENSET.delete(id) : OPENSET.add(id); render(); break;
    case 'go': {
      if (S.running && S.running.taskId === id && S.running.startTs) pauseTimer();
      else startTimer(id);
      break; }
    case 'go-todo': {
      const x = todoById(id); if (!x || !x.taskId) break;
      startTimer(x.taskId, x.id); tab = 'focus'; render(); toast('开始计时，已挂钩这条待办'); break; }
    case 'pause': pauseTimer(); break;
    case 'resume': if (S.running) startTimer(S.running.taskId); break;
    case 'stop': stopTimer(); break;
    case 'mode': S.settings.mode = el.dataset.v; pomoAlerted = false; save(); render(); break;
    case 'hook': openHook(); break;
    case 'check': toggleTodo(id); break;
    case 'task-menu': e.stopPropagation(); openTaskMenu(id); break;
    case 'new-task': openNewTask(null); break;
    case 'new-child': closeSheet(); openNewTask(id); break;
    case 'new-todo': openTodo(null, el.dataset.days, el.dataset.kind); break;
    case 'edit-todo': openTodo(id); break;
    case 'new-plan': openPlan(null); break;
    case 'edit-plan': openPlan(id); break;
    case 'log': openLog(); break;
    case 'day': {
      const v = +el.dataset.v;
      statDay = v === 0 ? today() : addDays(statDay || today(), v);
      if (statDay > today()) statDay = today();
      renderStat(); break; }
    case 'del-sess': {
      if (!confirm('删除这段专注记录？当日统计时长会一起减少。')) return;
      S.sessions = S.sessions.filter(s => s.id !== id);
      renderStat(); toast('已删除');
      api(`/api/sessions/${encodeURIComponent(id)}`, { method: 'DELETE' })
        .then(({data}) => { S.sessions = data.sessions; SREV = data.srev; renderStat(); })
        .catch(() => toast('后台没删掉，刷新看看'));
      break; }
    case 'mask': if (e.target === el || el.tagName === 'BUTTON') closeSheet(); break;

    case 'add-task': {
      const name = $('#n-name').value.trim(); if (!name) return toast('先起个名字');
      const gi = +$('#n-grad').querySelector('[aria-pressed=true]').dataset.gi;
      S.tasks.push({ id: uid(), name, parentId: el.dataset.pid || null, g: GRAD[gi],
        target: +$('#n-target').value || 0, order: S.tasks.length });
      if (el.dataset.pid) OPEN.add(el.dataset.pid);
      save(); closeSheet(); render(); break; }

    case 'inherit-color': { const t = byId(id); if (t){ t.g = null; save(); closeSheet(); render(); } break; }
    case 'save-task': {
      const t = byId(id); if (!t) return;
      t.name = $('#t-name').value.trim() || t.name;
      t.target = Math.max(0, +$('#t-target').value || 0);
      const sel = $('#t-grad').querySelector('[aria-pressed=true]');
      if (sel) t.g = GRAD[+sel.dataset.gi];
      save(); closeSheet(); render(); break; }

    case 'del-task': {
      const ids = subtree(id);
      if (!confirm(`删除「${byId(id).name}」${ids.length>1?`及其 ${ids.length-1} 个子任务`:''}？相关专注记录也会删掉。`)) return;
      const dropIds = S.sessions.filter(s => ids.includes(s.taskId)).map(s => s.id);
      S.tasks = S.tasks.filter(t => !ids.includes(t.id));
      S.sessions = S.sessions.filter(s => !ids.includes(s.taskId));
      S.todos.forEach(x => { if (ids.includes(x.taskId)) x.taskId = null; });
      S.plans.forEach(x => { if (ids.includes(x.taskId)) x.taskId = null; });
      if (S.running && ids.includes(S.running.taskId)) stopTimer();
      save(); closeSheet(); render();
      if (dropIds.length)
        api('/api/sessions/delete', { method: 'POST', body: JSON.stringify({ ids: dropIds }) })
          .then(({data}) => { S.sessions = data.sessions; SREV = data.srev; })
          .catch(() => {});
      break; }

    case 'save-todo': {
      const title = $('#d-title').value.trim(); if (!title) return toast('先写点内容');
      const formKind = $('#d-kind').querySelector('[aria-pressed=true]').dataset.v;
      const cv = $('#d-cyc').querySelector('[aria-pressed=true]').dataset.v;
      const repeat = $('#d-repeat').getAttribute('aria-pressed') === 'true';
      let kind = formKind;
      if (formKind === 'loop' && cv === 'c' && !repeat) kind = 'dated';
      const days = cv === 'c' ? Math.max(1, +$('#d-days').value || 1) : +cv;
      const onExpire = $('#d-exp').querySelector('[aria-pressed=true]')?.dataset.v || 'reset';
      const taskId = window.__pickTask ? window.__pickTask() : null;
      const startDate = kind === 'loop' ? ($('#d-start-date').value || today()) : ($('#d-start-dt').value || today());
      const startTime = kind === 'dated' ? ($('#d-start-time').value || '00:00') : '00:00';
      const dueDate = kind === 'loop' ? addDays(startDate, Math.max(1, days) - 1) : ($('#d-due-date').value || today());
      const dueTime = kind === 'dated' ? ($('#d-due-time').value || '23:59') : '23:59';
      if (kind === 'dated' && new Date(`${dueDate}T${dueTime}`).getTime() <= new Date(`${startDate}T${startTime}`).getTime()) return toast('结束时间要晚于开始时间');
      if (id){
        const x = todoById(id);
        normalizeTodo(x);
        const changedBase = x.kind !== kind || x.cycleDays !== days || (kind === 'loop' && x.cycleStart !== startDate) || (kind === 'dated' && (x.startDate !== startDate || x.startTime !== startTime));
        Object.assign(x, { title, kind, cycleDays: kind === 'loop' ? days : 0, onExpire, taskId,
          cycleStart: kind === 'loop' ? startDate : undefined,
          startDate: kind === 'dated' ? startDate : undefined,
          startTime: kind === 'dated' ? startTime : undefined,
          dueDate: kind === 'dated' ? dueDate : undefined,
          dueTime: kind === 'dated' ? dueTime : undefined });
        if (changedBase) x.timeBase = kind === 'loop' ? fromDk(startDate) : kind === 'dated' ? new Date(`${startDate}T${startTime}`).getTime() : Date.now();
      } else {
        S.todos.push({ id: uid(), title, taskId, kind, cycleDays: kind === 'loop' ? days : 0, onExpire,
          cycleStart: kind === 'loop' ? startDate : undefined,
          startDate: kind === 'dated' ? startDate : undefined,
          startTime: kind === 'dated' ? startTime : undefined,
          dueDate: kind === 'dated' ? dueDate : undefined,
          dueTime: kind === 'dated' ? dueTime : undefined,
          timeBase: kind === 'loop' ? fromDk(startDate) : kind === 'dated' ? new Date(`${startDate}T${startTime}`).getTime() : Date.now(),
          done: false, doneAt: null, order: S.todos.length });
        OPENSET.add(kind === 'loop' ? `loop:${days}` : kind);
      }
      save(); closeSheet(); tab = 'todo'; render(); break; }

    case 'del-todo': {
      const x = todoById(id); if (!x) return;
      normalizeTodo(x);
      const mins = todoMin(x), od = isOverdue(x);
      if (!confirm(od ? '结束这条逾期待办？它会进入统计页「已结算」，标记为逾期未完成。' : '结束并删除这条待办？已经记下的专注时间会保留在任务上。')) return;
      if (od) settleTodo(x, 'expired', today(), mins);
      else if (mins > 0) settleTodo(x, 'ended', today(), mins);
      S.todos = S.todos.filter(x => x.id !== id);
      S.sessions.forEach(s => { if (s.todoId === id) s.todoId = null; });
      if (S.running && S.running.todoId === id) hookTimer(null);
      save(); closeSheet(); render();
      api('/api/sessions/unhook', { method: 'POST', body: JSON.stringify({ todoId: id }) })
        .then(({data}) => { S.sessions = data.sessions; SREV = data.srev; })
        .catch(() => {});
      break; }

    case 'save-plan': {
      const title = $('#pl-title').value.trim(); if (!title) return toast('先写点内容');
      const data = {
        title,
        taskId: window.__pickTask ? window.__pickTask() : null,
        startDate: $('#pl-start').value || today(),
        cycleDays: Math.max(1, +$('#pl-cycle').value || 7),
        dueDays: Math.max(1, +$('#pl-due').value || 7),
        active: true
      };
      if (id) Object.assign(planById(id), data);
      else S.plans.push(Object.assign({ id: uid(), createdAt: Date.now() }, data));
      save(); closeSheet(); render(); break; }

    case 'del-plan':
      if (!confirm('删除这个周期自定待办？已经创建出来的待办不会删除。')) return;
      S.plans = S.plans.filter(p => p.id !== id);
      save(); closeSheet(); render(); break;

    case 'keep-auto': ackAuto(id); closeSheet(); break;
    case 'drop-auto': {
      ackAuto(id); closeSheet();
      S.sessions = S.sessions.filter(s => s.id !== id); render(); toast('已删掉');
      api(`/api/sessions/${encodeURIComponent(id)}`, { method: 'DELETE' })
        .then(({data}) => { S.sessions = data.sessions; SREV = data.srev; render(); })
        .catch(() => toast('后台没删掉，刷新看看'));
      break; }

    case 'dismiss-plan':
      DISMISSED_PLANS.add(id); closeSheet(); break;

    case 'make-plan-todo': {
      const p = planById(id); if (!p) return;
      const start = el.dataset.start || planCycleStart(p);
      const dueDate = $('#p-make-due').value || planDueDate(p, start);
      const title = $('#p-make-title').value.trim() || p.title;
      S.todos.push({ id: uid(), title, taskId: p.taskId || null, kind: 'dated', cycleDays: 0,
        startDate: start, startTime: '00:00', dueDate, dueTime: '23:59',
        planId: p.id, planStart: start, timeBase: fromDk(start), done: false, doneAt: null, order: S.todos.length });
      p.lastCreated = start;
      save(); closeSheet(); tab = 'todo'; render(); toast('已创建待办'); break; }

    case 'save-log': {
      const taskId = window.__pickTask ? window.__pickTask() : null;
      const day = $('#g-day').value, s1 = $('#g-s').value, s2 = $('#g-e').value;
      if (!taskId || !day || !s1 || !s2) return toast('信息填完整');
      const start = new Date(`${day}T${s1}`).getTime();
      let end = new Date(`${day}T${s2}`).getTime();
      if (end <= start) end += DAY;
      if (end - start > 16*3600000) return toast('超过 16 小时，检查一下');
      const sess = { id: uid(), taskId, todoId: $('#g-todo').value || null, start, end, manual: true };
      S.sessions.push(sess);
      closeSheet(); render(); toast(`已补记 ${fmtMin((end-start)/60000)}`);
      api('/api/sessions', { method: 'POST', body: JSON.stringify(sess) })
        .then(({data}) => { S.sessions = data.sessions; SREV = data.srev; render(); })
        .catch(() => toast('补记没存到后台'));
      break; }

    case 'save-me': {
      S.settings.examDate = $('#m-exam').value || S.settings.examDate;
      S.settings.showCountdown = $('#m-cd').querySelector('[aria-pressed=true]').dataset.v === '1';
      S.settings.countdownText = $('#m-count-text').value.trim() || 'D-{days}';
      S.settings.countdownSlogan = $('#m-count-slogan').value.trim();
      S.settings.pomoMin = Math.max(1, +$('#m-pomo').value || 25);
      S.settings.autoStopHours = Math.max(0, Math.min(24, +$('#m-autostop').value || 0));
      save(); render(); toast('已保存'); break; }

    case 'export': {
      const b = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = `专注数据-${today()}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 800); break; }

    case 'import': {
      const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
      i.onchange = () => { const f = i.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => { try { const d = JSON.parse(r.result); if (!d.tasks) throw 0;
          S = d; ['tasks','todos','sessions','completions','plans'].forEach(k => S[k] = S[k]||[]);
          S.settings = Object.assign(seed().settings, S.settings||{});
          S.running = null;
          replaceAll('已导入'); } catch(err){ toast('读不出来，确认是本应用导出的 JSON'); } };
        r.readAsText(f); };
      i.click(); break; }

    case 'reset':
      if (confirm('清空全部任务、待办和记录？')) { S = seed(); S.running = null; replaceAll('已清空'); }
      break;
  }
});
document.addEventListener('click', e => {
  const h = e.target.closest('[data-hook]'); if (!h) return;
  closeSheet();
  hookTimer(h.dataset.hook || null);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.code === 'Space' && !e.target.closest('input,select,textarea') && !$('#modals').children.length && S.running){
    e.preventDefault();
    S.running.startTs ? pauseTimer() : startTimer(S.running.taskId);
  }
});
/* 关页面不再结束计时，只把还没写完的改动推上去 */
window.addEventListener('beforeunload', () => { if (S) flushSave(true); });
document.addEventListener('visibilitychange', () => {
  if (!S) return;
  if (document.hidden) flushSave();
  else syncPoll();
});

/* ================= 启动 ================= */
(async () => {
  if (!await load()) return renderDead();
  statDay = today();
  render();
  checkAutoStopped();
  setInterval(tick, 1000);
  setInterval(syncPoll, 10000);
  setInterval(() => { if (window.__d !== today()){ window.__d = today(); render(); } }, 30000);
  window.__d = today();
})();

</script>
</body>
</html>
